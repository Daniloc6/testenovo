<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Produtos - DT Inova 3D</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style2.css">
  <link rel="stylesheet" href="css/styles.css">
  </head>
<body>
   <!-- Navegação -->
  <<nav class="menu" id="menu">
  <div class="menu-conteudo">
    <img class="menu-logo" src="assets/logo.png" alt="Logo DT Inova 3D">
    <a href="index.html" class="botao1">Home</a>
    <a href="produtos.html" class="botao1">Produtos</a>
    <a href="orcamentos.html" class="botao1">Orçamentos</a>
    <a href="contatos.html" class="botao1">Contatos</a>
    <a href="historia.html" class="botao1">Nossa História</a>
    <!-- Ícone de pesquisa -->
    <form class="menu-pesquisa">
      <input type="text" placeholder="Pesquisar..." aria-label="Pesquisar">
      <button type="submit">
        <img src="assets/pesquisa.png" alt="Pesquisar" width="22" height="22">
      </button>
    </form>
  </div>
</nav>
    <header>
  <h2>Catálogo DT Inova 3D</h2>
  <div class="grid-catalogo">

    <!-- Exemplo de 3 itens -->
    <div class="card-item">
      <img src="assets/dragao-articulado.png" alt="Dragão articulado">
      <h3>Dragão Articulado</h3>
      <p>Brinquedo flexível, campeão de vendas.</p>
      <div class="cores"><span class="cor cor-azul"></span><span class="cor cor-verde"></span><span class="cor cor-roxo"></span></div>
      <button class="botao">Comprar</button>
    </div>

    <div class="card-item">
      <img src="assets/cobra-articulada.png" alt="Cobra articulada">
      <h3>Cobra Articulada</h3>
      <p>Peça articulada divertida e colecionável.</p>
      <div class="cores"><span class="cor cor-preto"></span><span class="cor cor-verde"></span><span class="cor cor-dourado"></span></div>
      <button class="botao">Comprar</button>
    </div>

    <div class="card-item">
      <img src="assets/miniatura-rpg.png" alt="Miniatura RPG">
      <h3>Miniatura RPG</h3>
      <p>Miniaturas detalhadas para jogos de mesa.</p>
      <div class="cores"><span class="cor cor-prata"></span><span class="cor cor-dourado"></span><span class="cor cor-preto"></span></div>
      <button class="botao">Comprar</button>
    </div>

    <!-- Continue até os 50 itens -->
  </div>
  </header>
</body>
</html>
